<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Edge Box Health</title>
<style>
body { font-family: sans-serif; margin: 20px; background: #111; color: #eee; }
#health { font-size: 26px; font-weight: bold; padding: 10px 20px; border-radius: 8px; display: inline-block; }
.ok { background: #1d7a1d; }
.warn { background: #b58900; }
.critical { background: #b3261e; }
.cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
.card { background: #222; padding: 12px 16px; border-radius: 8px; min-width: 130px; }
.card b { font-size: 22px; display: block; }
canvas { background: #222; border-radius: 8px; width: 100%; height: 180px; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; }
td, th { border-bottom: 1px solid #333; padding: 6px 8px; text-align: left; }
h2 { margin-top: 28px; }
</style>
</head>
<body>
<h1>Edge Box Health</h1>
<div id="health" class="ok">...</div>
<div class="cards">
<div class="card">CPU<b id="cpu">-</b></div>
<div class="card">RAM<b id="ram">-</b></div>
<div class="card">Disk<b id="disk">-</b></div>
<div class="card">Net sent<b id="sent">-</b></div>
<div class="card">Net recv<b id="recv">-</b></div>
<div class="card">Uptime<b id="uptime">-</b></div>
</div>
<h2>Last hour</h2>
<canvas id="chart1h" width="900" height="180"></canvas>
<h2>Last 24 hours</h2>
<canvas id="chart24h" width="900" height="180"></canvas>
<h2>Open alerts</h2>
<ul id="open-alerts"></ul>
<h2>Closed alerts</h2>
<ul id="closed-alerts"></ul>
<h2>Top processes</h2>
<table>
<thead><tr><th>PID</th><th>Name</th><th>CPU %</th><th>RSS MB</th></tr></thead>
<tbody id="procs"></tbody>
</table>
<script>
async function get(path) {
  const res = await fetch(path);
  return res.json();
}

function drawChart(canvas, rows, key, color) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (rows.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  rows.forEach((r, i) => {
    const x = (i / (rows.length - 1)) * w;
    const y = h - (r[key] / 100) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// function fmtMB(n) {
//   return (n / 1024 / 1024).toFixed(0) + " MB";
// }

// function fmtMB(n) {
//   if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + " MB/s";
//   return (n / 1024).toFixed(1) + " KB/s";
// }

function fmtRate(n) {
  if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + " MB/s";
  return (n / 1024).toFixed(1) + " KB/s";
}



async function refresh() {
  const health = await get("/health");
  const badge = document.getElementById("health");
  badge.textContent = health.status.toUpperCase();
  badge.className = health.status;

  const m = await get("/metrics");
  document.getElementById("cpu").textContent = (m.cpu_total || 0).toFixed(1) + "%";
  document.getElementById("ram").textContent = (m.ram_percent || 0).toFixed(1) + "%";
  document.getElementById("disk").textContent = (m.disk_percent || 0).toFixed(1) + "%";
  document.getElementById("sent").textContent = fmtRate(m.net_sent_rate || 0);
  document.getElementById("recv").textContent = fmtRate(m.net_recv_rate || 0);

  document.getElementById("uptime").textContent = Math.floor((m.uptime || 0) / 3600) + "h";

  const h1 = await get("/history?hours=1");
  drawChart(document.getElementById("chart1h"), h1, "cpu_total", "#4da6ff");
  const h24 = await get("/history?hours=24");
  drawChart(document.getElementById("chart24h"), h24, "cpu_total", "#4da6ff");

  const a = await get("/alerts");
  document.getElementById("open-alerts").innerHTML = a.open.map(x => "<li>" + x.name + " peak " + x.peak + "</li>").join("") || "<li>none</li>";
  document.getElementById("closed-alerts").innerHTML = a.closed.map(x => "<li>" + x.name + " peak " + x.peak + "</li>").join("") || "<li>none</li>";

  const procs = await get("/processes");
  document.getElementById("procs").innerHTML = procs.map(p => "<tr><td>" + p.pid + "</td><td>" + p.name + "</td><td>" + p.cpu.toFixed(1) + "</td><td>" + (p.rss / 1024 / 1024).toFixed(0) + "</td></tr>").join("");
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
